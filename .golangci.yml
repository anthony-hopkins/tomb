# golangci-lint v2 configuration.
#
# `make lint` runs this locally and CI runs it on every push, alongside gofmt,
# vet and the tests. The standard linter set -- errcheck, govet, ineffassign,
# staticcheck, unused -- and nothing exotic: the point is a floor that stays at
# zero findings, so a real one is never one line in a page of noise.
#
# Nothing is excluded. Where ignoring an error is the right call -- draining a
# response body, closing on the way out of the process -- the code says so
# with an explicit `_ =` and a comment, rather than a rule here saying it for
# every call site at once.
version: "2"

linters:
  default: standard

formatters:
  enable:
    - gofmt
