name: Infra destroy

# Tears down the Google Cloud infrastructure. Manual only, and deliberately
# awkward: it tears down the VM serving the site. The Postgres data disk is
# guarded separately and survives -- see the note in the run summary.
#
# Guards, all of which must be satisfied:
#   1. it is manual only -- nothing triggers this automatically
#   2. you type the project id into `confirm_project`
#   3. you type DESTROY into `confirm_phrase`
#   4. dry_run defaults to true, so the first run only ever produces a plan
#
# A required reviewer on the `production-destroy` environment would be a fifth,
# and is the right thing to add if this repository goes public or the account
# moves to a paid plan -- GitHub does not offer environment protection rules on
# private repositories on the free plan.
#
# The state bucket is NOT destroyed, and neither is anything in tofu/bootstrap.
# Those are removed by hand if you genuinely mean it.

on:
  workflow_dispatch:
    inputs:
      confirm_project:
        description: "Type the GCP project id exactly"
        required: true
        type: string
      confirm_phrase:
        description: "Type DESTROY to confirm"
        required: true
        type: string
      dry_run:
        description: "Only show a destroy plan; delete nothing"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production # same group as deploy.yml: never both at once
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Check the typed confirmations before requesting an approval, so a reviewer
  # is never asked to approve a request that was going to fail anyway.
  # ---------------------------------------------------------------------------
  guard:
    name: Check confirmations
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation phrase
        run: |
          if [ "${{ inputs.confirm_phrase }}" != "DESTROY" ]; then
            echo "::error::confirm_phrase must be exactly DESTROY"
            exit 1
          fi

      - name: Project id
        run: |
          if [ "${{ inputs.confirm_project }}" != "${{ vars.GCP_PROJECT_ID }}" ]; then
            echo "::error::confirm_project does not match the configured project"
            exit 1
          fi

      - name: Note the mode
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "::notice::Dry run — a destroy plan will be produced and nothing deleted."
          else
            echo "::warning::LIVE DESTROY requested. The VM, network and secrets will be deleted."
          fi

  destroy:
    name: Destroy
    needs: guard
    runs-on: ubuntu-latest
    # Declared so teardown shows in the repository's deployment history as a
    # distinct environment. Add a required reviewer here when the plan allows.
    environment:
      name: production-destroy
    defaults:
      run:
        working-directory: tofu

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6

      - name: Init
        run: tofu init -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"

      - name: Record what exists, for the audit trail
        run: |
          {
            echo "### Resources currently in state"
            echo ""
            echo '```'
            tofu state list || echo "(no state)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Note what destroy cannot remove
        run: |
          echo "::warning::The Postgres data disk (tomb-platform-data) carries prevent_destroy."
          echo "::warning::tofu destroy will REFUSE while that guard is in place - which is the point."
          {
            echo ""
            echo "### The data disk survives"
            echo ""
            echo "\`tomb-platform-data\` holds every user and session row and is marked"
            echo "\`prevent_destroy\` in compute.tf, so this workflow cannot delete it."
            echo "Destroy will tear down the VM, network and secrets and then stop."
            echo ""
            echo "To remove the data too, after this run:"
            echo ""
            echo "1. snapshot it: \`gcloud compute disks snapshot tomb-platform-data --zone ZONE\`"
            echo "2. remove the lifecycle block in \`tofu/compute.tf\`"
            echo "3. re-run this workflow"
            echo ""
            echo "That is three deliberate steps rather than one command, on purpose."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy plan
        run: |
          tofu plan -destroy -no-color -lock-timeout=5m \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="guild_realm=${{ vars.TOMB_GUILD_REALM }}" \
            -var="bnet_client_id=${{ vars.BNET_CLIENT_ID }}" \
            -var="guild_ranks=${{ vars.TOMB_GUILD_RANKS }}" \
            -var="guild_roster_ttl=${{ vars.TOMB_GUILD_ROSTER_TTL }}" \
            -var="guild_officer_rank=${{ vars.TOMB_GUILD_OFFICER_RANK }}" \
            -var="timezone=${{ vars.TOMB_TIMEZONE }}" \
            -var="admin=${{ vars.TOMB_ADMIN }}" \
            -var="domain=${{ vars.TOMB_DOMAIN }}" \
            -var="acme_email=${{ vars.ACME_EMAIL }}" \
            -var="image=${{ vars.GCP_CURRENT_IMAGE || 'gcr.io/google-containers/pause:3.9' }}" \
            | tee destroy-plan.txt

          {
            echo ""
            echo "### Destroy plan"
            echo ""
            echo '```terraform'
            tail -c 40000 destroy-plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop here on a dry run
        if: ${{ inputs.dry_run }}
        run: echo "::notice::Dry run complete. Nothing was deleted. Re-run with dry_run unchecked to proceed."

      - name: Destroy
        if: ${{ !inputs.dry_run }}
        run: |
          tofu destroy -auto-approve -lock-timeout=5m -input=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="guild_realm=${{ vars.TOMB_GUILD_REALM }}" \
            -var="bnet_client_id=${{ vars.BNET_CLIENT_ID }}" \
            -var="guild_ranks=${{ vars.TOMB_GUILD_RANKS }}" \
            -var="guild_roster_ttl=${{ vars.TOMB_GUILD_ROSTER_TTL }}" \
            -var="guild_officer_rank=${{ vars.TOMB_GUILD_OFFICER_RANK }}" \
            -var="timezone=${{ vars.TOMB_TIMEZONE }}" \
            -var="admin=${{ vars.TOMB_ADMIN }}" \
            -var="domain=${{ vars.TOMB_DOMAIN }}" \
            -var="acme_email=${{ vars.ACME_EMAIL }}" \
            -var="image=${{ vars.GCP_CURRENT_IMAGE || 'gcr.io/google-containers/pause:3.9' }}"

      - name: What survived, on purpose
        if: ${{ !inputs.dry_run }}
        run: |
          {
            echo ""
            echo "### Destroyed"
            echo ""
            echo "Still present, deliberately:"
            echo ""
            echo "- the state bucket \`${{ vars.GCP_STATE_BUCKET }}\` and its version history"
            echo "- everything in \`tofu/bootstrap\` (WIF pool, deployer service account)"
            echo "- the Postgres data disk, which carries prevent_destroy"
            echo "- the project itself and its enabled APIs"
            echo ""
            echo "Remove those by hand if you mean to close the project down entirely."
          } >> "$GITHUB_STEP_SUMMARY"
