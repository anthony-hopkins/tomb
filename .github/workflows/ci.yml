name: CI

# The merge gate from the constitution's Development Workflow: go build, go vet,
# go test ./..., and a successful Docker image build.
#
# Pull requests only, against any base branch -- feature branches open into
# `develop`, and `develop` opens into `main` to promote to production.
#
# deploy.yml runs the same test suite and Docker build on a push to develop or
# main, so triggering here as well ran the Go tests twice and built the image
# twice for every merge. The merge itself is covered by Deploy; this workflow
# guards the pull request that precedes it.
#
# Infrastructure review lives in infra-plan.yml, which posts a real `tofu plan`
# to the pull request. Deployment lives in deploy.yml.

on:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # The linter set in .golangci.yml, pinned to the same major the Makefile
      # assumes. Runs after vet so a compile error is reported by the compiler
      # rather than by a linter's less helpful rendering of it.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13

      # -race catches data races in the bounded character fan-out, which is the
      # one genuinely concurrent piece of this codebase (research.md D9).
      - name: go test
        run: go test -race ./...

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t tomb-platform .
