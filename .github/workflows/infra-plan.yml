name: Infra plan

# Constitution Principle V: any change touching Google Cloud must include the
# `tofu plan` output for review before `tofu apply` runs. This workflow is how
# that review happens -- it posts the plan as a PR comment and never applies.

on:
  pull_request:
    paths:
      - "tofu/**"
      - ".github/workflows/infra-plan.yml"

# Only ever reads. Applying is a separate, manually dispatched workflow
# (deploy.yml); this one holds no apply path at all.
permissions:
  contents: read
  id-token: write # required to mint the OIDC token for GCP
  pull-requests: write # required to post the plan comment

concurrency:
  group: infra-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tofu

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # Keyless: GitHub presents an OIDC token, Google exchanges it for a
          # short-lived access token. No service-account key exists.
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6

      - name: Format check
        run: tofu fmt -check -diff

      - name: Init
        run: tofu init -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"

      - name: Select the workspace for this pull request's target
        id: ws
        # A plan is only worth reading if it is the plan for the environment the
        # pull request actually changes. A PR into `develop` that showed a
        # production diff would be worse than no plan at all -- it would invite
        # someone to approve production changes they are not making.
        #
        # `-or-create` so a PR into develop can be planned before that
        # environment has ever been applied; the workspace is then empty and the
        # plan correctly reads "create everything".
        env:
          BASE: ${{ github.base_ref }}
          PROD_DOMAIN: ${{ vars.TOMB_DOMAIN }}
          DEV_DOMAIN: ${{ vars.TOMB_DEVELOP_DOMAIN }}
        run: |
          set -euo pipefail

          if [ "$BASE" = "develop" ]; then
            workspace="develop"; environment="develop"; snapshots="false"; auto_stop="true"
            domain="${DEV_DOMAIN:-}"
            if [ -z "$domain" ] && [ -n "$PROD_DOMAIN" ]; then
              domain="dev.$PROD_DOMAIN"
            fi
          else
            workspace="default"; environment="production"; snapshots="true"; auto_stop="false"
            domain="$PROD_DOMAIN"
          fi

          tofu workspace select -or-create "$workspace"
          echo "planning $environment (workspace $workspace)"

          {
            echo "environment=$environment"
            echo "domain=$domain"
            echo "snapshots=$snapshots"
            echo "auto_stop=$auto_stop"
          } >> "$GITHUB_OUTPUT"

      - name: Validate
        run: tofu validate -no-color

      - name: Plan
        id: plan
        # Exit code 2 means "changes present", which is not a failure.
        run: |
          set +e
          tofu plan -no-color -lock-timeout=5m -detailed-exitcode \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="guild_realm=${{ vars.TOMB_GUILD_REALM }}" \
            -var="bnet_client_id=${{ vars.BNET_CLIENT_ID }}" \
            -var="guild_ranks=${{ vars.TOMB_GUILD_RANKS }}" \
            -var="guild_roster_ttl=${{ vars.TOMB_GUILD_ROSTER_TTL }}" \
            -var="guild_officer_rank=${{ vars.TOMB_GUILD_OFFICER_RANK }}" \
            -var="timezone=${{ vars.TOMB_TIMEZONE }}" \
            -var="domain=${{ steps.ws.outputs.domain }}" \
            -var="enable_snapshots=${{ steps.ws.outputs.snapshots }}" \
            -var="enable_auto_stop=${{ steps.ws.outputs.auto_stop }}" \
            -var="acme_email=${{ vars.ACME_EMAIL }}" \
            -var="image=${{ vars.GCP_CURRENT_IMAGE || 'gcr.io/google-containers/pause:3.9' }}" \
            > plan.txt 2>&1
          code=$?
          set -e

          if [ "$code" -eq 1 ]; then
            echo "::error::tofu plan failed"
            tail -50 plan.txt
            exit 1
          fi

          # Read the change summary out of the plan itself rather than trusting
          # the exit code alone. Reporting "no changes" on a plan that creates
          # seventeen resources is worse than reporting nothing, so the plan
          # text is the authority and the exit code is only a fallback.
          summary=$(grep -E '^(Plan: |No changes)' plan.txt | tail -1 || true)
          if [ -z "$summary" ]; then
            summary="(no summary line found - read the full plan)"
          fi

          if printf '%s' "$summary" | grep -q '^Plan: '; then
            changes=true
          elif [ "$code" -eq 2 ]; then
            changes=true
          else
            changes=false
          fi

          echo "exitcode=$code"   >> "$GITHUB_OUTPUT"
          echo "changes=$changes" >> "$GITHUB_OUTPUT"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

          echo "::notice::$summary"
          printf '### Infrastructure plan\n\n`%s`\n' "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Post plan to the pull request
        uses: actions/github-script@v7
        env:
          HAS_CHANGES: ${{ steps.plan.outputs.changes }}
          PLAN_SUMMARY: ${{ steps.plan.outputs.summary }}
          PLAN_ENVIRONMENT: ${{ steps.ws.outputs.environment }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('tofu/plan.txt', 'utf8');

            // A PR comment caps at 65536 characters; keep the tail, which is
            // where the summary line lives.
            const LIMIT = 60000;
            let truncated = false;
            if (plan.length > LIMIT) {
              plan = plan.slice(plan.length - LIMIT);
              truncated = true;
            }

            const changes = process.env.HAS_CHANGES === 'true';
            const summary = process.env.PLAN_SUMMARY || '';
            // Name the environment in the heading. With two of them, a plan
            // that does not say which one it is for is a plan nobody can
            // safely approve.
            const environment = process.env.PLAN_ENVIRONMENT || 'production';
            const heading = changes
              ? `### Infrastructure plan (${environment}) — changes to apply`
              : `### Infrastructure plan (${environment}) — no changes`;

            const body = [
              heading,
              '',
              summary ? '`' + summary + '`' : '',
              truncated ? '_Output truncated; showing the tail. Full log in the workflow run._\n' : '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              changes
                ? '_Merging does **not** apply this. Run the **Deploy** workflow manually with `apply` checked._'
                : '_Nothing to apply._',
            ].join('\n');

            // Replace our previous comment rather than stacking new ones.
            const marker = 'Infrastructure plan';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker));

            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: mine.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload plan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tofu-plan
          path: tofu/plan.txt
          retention-days: 14
