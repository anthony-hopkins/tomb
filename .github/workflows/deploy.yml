name: Deploy

# Builds the image, applies infrastructure, rolls the VM onto the new image,
# and verifies the result is alive. This is both "deploy" and "upgrade": an
# application change and an infrastructure change take the same path.
#
# The stack runs as a Compose project on one Compute Engine VM -- Caddy for
# TLS, the Go app, and self-hosted Postgres on a persistent disk.
#
# HOW THE PRODUCTION GATE WORKS
#
# Principle V requires human approval before a production apply. The obvious
# mechanism -- a required reviewer on the `production` environment -- is not
# available here: GitHub does not offer environment protection rules on private
# repositories on the free plan.
#
# So the approval is the trigger itself. A push to main runs the tests and
# builds and pushes the image, but does NOT apply. Applying requires someone to
# deliberately run this workflow from the Actions tab, which is a human
# decision with an audit trail, just a different shape.
#
# If the repository ever goes public, or the account moves to a paid plan, add a
# required reviewer to the `production` environment and delete the
# `github.event_name == workflow_dispatch` condition on the apply job to get
# auto-deploy-on-merge with an approval prompt.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".specify/**"
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Reuse the image already deployed (infrastructure-only change)"
        type: boolean
        default: false
      apply:
        description: "Apply to production. Unchecked runs test and build only."
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Never let two applies touch the same state at once. Not cancel-in-progress:
# interrupting an apply mid-flight is how state drifts from reality.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Gate: the application test suite must pass before anything is deployed.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  # ---------------------------------------------------------------------------
  # Build and push the container image, tagged with the commit SHA.
  # ---------------------------------------------------------------------------
  build:
    name: Build and push image
    needs: test
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Compute the image tag
        id: meta
        run: |
          host="${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev"
          image="$host/${{ vars.GCP_PROJECT_ID }}/tomb/platform:${GITHUB_SHA::12}"
          echo "host=$host"   >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ steps.meta.outputs.host }}" --quiet

      - name: Build
        run: docker build -t "${{ steps.meta.outputs.image }}" .

      - name: Push
        # Tags are immutable in this repository, so a re-run of the same commit
        # finds the tag already present. That is success, not failure.
        run: |
          if docker push "${{ steps.meta.outputs.image }}"; then
            echo "pushed ${{ steps.meta.outputs.image }}"
          else
            echo "::notice::Push failed; checking whether this tag already exists"
            gcloud artifacts docker images describe "${{ steps.meta.outputs.image }}" >/dev/null
            echo "::notice::Tag already present (immutable tags); continuing"
          fi

  # ---------------------------------------------------------------------------
  # Apply. Gated by the `production` environment.
  # ---------------------------------------------------------------------------
  apply:
    name: Apply infrastructure
    needs: [test, build]
    # Two conditions. `always()` so an infrastructure-only dispatch (build
    # skipped) still runs, but only when nothing failed; and the run must be a
    # deliberate manual dispatch with apply checked -- a push to main builds
    # the image and stops. See the note at the top of this file.
    if: ${{ always()
      && github.event_name == 'workflow_dispatch'
      && inputs.apply
      && needs.test.result == 'success'
      && needs.build.result != 'failure'
      && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.outputs.outputs.service_url }}
    defaults:
      run:
        working-directory: tofu
    outputs:
      service_url: ${{ steps.outputs.outputs.service_url }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6

      - name: Preflight - can the deployer actually do this?
        # tofu/bootstrap is applied by hand, so its role list can drift behind
        # what the main configuration needs. That drift otherwise surfaces as a
        # 403 partway through an apply, after earlier resources have already
        # been created or destroyed.
        #
        # Uses the Resource Manager testIamPermissions endpoint directly.
        # `gcloud projects test-iam-permissions` does not exist -- an earlier
        # version of this step called it, and because the failure was silenced
        # the broken command looked exactly like "no permissions granted" and
        # blocked a deploy with a false alarm. Hence: no stderr suppression, and
        # an API failure is reported as an API failure rather than as a missing
        # permission.
        run: |
          set -euo pipefail

          cat > /tmp/required.json <<'JSON'
          {"permissions":[
            "compute.instances.create",
            "compute.disks.create",
            "compute.firewalls.create",
            "compute.resourcePolicies.create",
            "compute.addresses.create",
            "secretmanager.secrets.create",
            "iam.serviceAccounts.create"
          ]}
          JSON

          token="$(gcloud auth print-access-token)"

          http_code=$(curl -sS -o /tmp/granted.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer $token"             -H "Content-Type: application/json"             "https://cloudresourcemanager.googleapis.com/v1/projects/${{ vars.GCP_PROJECT_ID }}:testIamPermissions"             -d @/tmp/required.json)

          if [ "$http_code" != "200" ]; then
            echo "::error::testIamPermissions returned HTTP $http_code, so the preflight could not run."
            cat /tmp/granted.json
            exit 1
          fi

          python3 - <<'PY'
          import json, sys

          required = set(json.load(open("/tmp/required.json"))["permissions"])
          granted = set(json.load(open("/tmp/granted.json")).get("permissions", []))
          missing = sorted(required - granted)

          if missing:
              print("::error::The deployer service account is missing: " + " ".join(missing))
              print("::error::tofu/bootstrap grants these, and it is applied by hand. Re-apply it:")
              print("::error::  cd tofu/bootstrap && tofu plan -out=tfplan && tofu apply tfplan")
              sys.exit(1)

          print(f"deployer holds all {len(required)} permissions this apply needs")
          PY

      - name: Init
        run: tofu init -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"

      - name: Resolve the image to deploy
        id: image
        run: |
          if [ -n "${{ needs.build.outputs.image }}" ]; then
            echo "image=${{ needs.build.outputs.image }}" >> "$GITHUB_OUTPUT"
          else
            # Infrastructure-only run: keep whatever Cloud Run is serving.
            current=$(tofu output -raw deployed_image 2>/dev/null || true)
            if [ -z "$current" ]; then
              echo "::error::No image was built and none is recorded in state. Run without skip_build for the first deploy."
              exit 1
            fi
            echo "image=$current" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply
        run: |
          tofu apply -auto-approve -lock-timeout=5m -input=false             -var="project_id=${{ vars.GCP_PROJECT_ID }}"             -var="guild_realm=${{ vars.TOMB_GUILD_REALM }}"             -var="bnet_client_id=${{ vars.BNET_CLIENT_ID }}"             -var="domain=${{ vars.TOMB_DOMAIN }}"             -var="acme_email=${{ vars.ACME_EMAIL }}"             -var="image=${{ steps.image.outputs.image }}"

      - name: Roll the VM onto the new image
        # The VM owns its own configuration: startup.sh writes /opt/tomb/.env
        # from instance metadata and Secret Manager at boot. A deploy is just a
        # pull and a restart, run over an IAP tunnel so the VM exposes no
        # public SSH.
        run: |
          instance=$(tofu output -raw instance_name)
          zone=$(tofu output -raw zone)
          image="${{ steps.image.outputs.image }}"

          echo "::notice::Deploying $image to $instance in $zone"

          # A freshly created VM may still be running its startup script, which
          # installs Docker. Retry rather than failing the first deploy.
          for attempt in $(seq 1 10); do
            if gcloud compute ssh "$instance"                  --zone "$zone"                  --tunnel-through-iap                  --quiet                  --command "sudo /opt/tomb/deploy.sh '$image'"; then
              echo "deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; the VM may still be bootstrapping"
            sleep 30
          done

          echo "::error::Could not deploy to the VM. Check the startup script output:"
          gcloud compute instances get-serial-port-output "$instance"             --zone "$zone" 2>/dev/null | tail -40 || true
          exit 1

      - name: Read outputs
        id: outputs
        run: echo "service_url=$(tofu output -raw service_url)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Post-deploy verification. A deploy that reports success without proving the
  # service answers is not a deploy.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify deployment
    needs: apply
    runs-on: ubuntu-latest

    steps:
      - name: Liveness
        run: |
          url="${{ needs.apply.outputs.service_url }}"
          echo "probing $url"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$url/healthz" | grep -qx ok; then
              echo "healthz ok (attempt $i)"
              exit 0
            fi
            echo "  attempt $i failed; retrying"
            sleep 6
          done
          echo "::error::/healthz never returned ok - the revision is not serving"
          exit 1

      - name: Readiness, including the database
        run: |
          url="${{ needs.apply.outputs.service_url }}"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$url/readyz" | grep -qx ok; then
              echo "readyz ok (attempt $i)"
              exit 0
            fi
            echo "  attempt $i failed; retrying"
            sleep 6
          done
          echo "::error::/readyz never returned ok - the app is up but cannot reach Postgres"
          exit 1

      - name: Landing page renders
        run: |
          url="${{ needs.apply.outputs.service_url }}"
          body=$(curl -fsS --max-time 15 "$url/")
          echo "$body" | grep -q "Sign in with Battle.net" \
            || { echo "::error::Landing page is missing the sign-in action"; exit 1; }
          echo "landing page ok"

      - name: Guild gate is enforced
        run: |
          url="${{ needs.apply.outputs.service_url }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url/app/dashboard")
          if [ "$code" != "302" ]; then
            echo "::error::/app/dashboard returned $code for an anonymous request; expected a 302 redirect"
            exit 1
          fi
          echo "anonymous access correctly redirected"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | ${{ needs.apply.outputs.service_url }} |"
            echo "| Commit | \`${GITHUB_SHA::12}\` |"
            echo ""
            echo "Liveness, readiness, landing page and the anonymous guild gate all verified."
          } >> "$GITHUB_STEP_SUMMARY"
