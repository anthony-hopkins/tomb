name: Deploy

# Builds the image, applies infrastructure, rolls the VM onto the new image,
# and verifies the result is alive. This is both "deploy" and "upgrade": an
# application change and an infrastructure change take the same path.
#
# The stack runs as a Compose project on one Compute Engine VM -- Caddy for
# TLS, the Go app, and self-hosted Postgres on a persistent disk.
#
# HOW THE PRODUCTION GATE WORKS
#
# Principle V requires human approval before a production apply. The obvious
# mechanism -- a required reviewer on the `production` environment -- is not
# available here: GitHub does not offer environment protection rules on private
# repositories on the free plan.
#
# So the approval is the trigger itself. A push to develop or main runs the tests
# and builds and pushes the image, but does NOT apply. Applying requires someone
# to deliberately run this workflow from the Actions tab, which is a human
# decision with an audit trail, just a different shape.
#
# BRANCH PROMOTION (constitution 2.0.0, Development Workflow)
#
# `develop` is the integration branch and `main` is production.
#
#   push to develop  -> test, build, APPLY to develop, verify
#   push to main     -> test and build only; production waits for a human
#   dispatch         -> pick the environment, apply if `apply` is checked
#
# Develop applying itself is the point of having it, and Principle V permits it
# explicitly for lower environments. Production keeps the manual gate.
#
# A branch and an environment cannot be mixed: production may only be applied
# from `main`, develop only from `develop`. The `resolve` job below refuses
# anything else before an apply can start, because the failure it prevents --
# applying a develop branch's infrastructure changes onto production -- is not
# one you get to notice afterwards.
#
# Which OpenTofu workspace each environment uses, and why production is
# `default`, is explained in tofu/environments.tf.
#
# If the repository ever goes public, or the account moves to a paid plan, add a
# required reviewer to the `production` environment and delete the
# `github.event_name == workflow_dispatch` condition on the apply job to get
# auto-deploy-on-merge with an approval prompt.

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".specify/**"
  workflow_dispatch:
    inputs:
      environment:
        # `auto` means "whatever this branch deploys to": main -> production,
        # develop -> develop. It is the default because the alternative made the
        # obvious action wrong -- dispatching Deploy from main and pressing run
        # targeted develop, which the branch guard then correctly refused with
        # "develop may only be deployed from the develop branch, not main".
        # A guard firing on the intended action is a broken default, not a
        # working guard. Choosing an environment explicitly still enforces it.
        description: "Which environment to act on (auto = whatever this branch deploys to)"
        type: choice
        options: [auto, develop, production]
        default: auto
      skip_build:
        description: "Reuse the image already deployed (infrastructure-only change)"
        type: boolean
        default: false
      apply:
        description: "Apply to the chosen environment. Unchecked runs test and build only."
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# Never let two applies touch the same state at once. Not cancel-in-progress:
# interrupting an apply mid-flight is how state drifts from reality.
#
# Keyed per environment, so a develop deploy and a production deploy do not
# queue behind each other -- they are different state files and cannot collide.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref_name == 'develop' && 'develop' || 'production') }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Work out what this run is actually targeting, once, so no later job has to
  # re-derive it from `github.ref` and reach a different answer.
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.t.outputs.environment }}
      workspace: ${{ steps.t.outputs.workspace }}
      domain: ${{ steps.t.outputs.domain }}
      snapshots: ${{ steps.t.outputs.snapshots }}
      auto_stop: ${{ steps.t.outputs.auto_stop }}
      apply: ${{ steps.t.outputs.apply }}

    steps:
      - name: Target
        id: t
        env:
          # Passed through the environment rather than interpolated into the
          # script: a repository variable is attacker-controlled in the same
          # sense any configuration is, and `${{ }}` inside a run block is
          # textual substitution into the shell.
          PROD_DOMAIN: ${{ vars.TOMB_DOMAIN }}
          DEV_DOMAIN: ${{ vars.TOMB_DEVELOP_DOMAIN }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail

          # What a branch deploys to, in one place, so `auto` and the push
          # paths below cannot drift apart.
          branch_environment() {
            if [ "$BRANCH" = "develop" ]; then echo develop; else echo production; fi
          }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            environment="$INPUT_ENVIRONMENT"
            apply="$INPUT_APPLY"

            if [ "$environment" = "auto" ] || [ -z "$environment" ]; then
              environment="$(branch_environment)"
              echo "::notice::environment=auto resolved to $environment from branch $BRANCH"
            fi
          elif [ "$BRANCH" = "develop" ]; then
            # Develop applies itself. That is what a lower environment is for.
            environment="develop"
            apply="true"
          else
            # A push to main builds the artifact and stops; Principle V wants a
            # human to decide when production changes.
            environment="production"
            apply="false"
          fi

          # A branch and an environment cannot be mixed. Checked even when
          # apply is false, so the mistake surfaces on the build too.
          case "$environment" in
            production)
              if [ "$BRANCH" != "main" ]; then
                echo "::error::production may only be deployed from main, not $BRANCH."
                echo "::error::Promote by opening a pull request from develop into main."
                exit 1
              fi
              workspace="default"
              snapshots="true"
              auto_stop="false"
              domain="$PROD_DOMAIN"
              ;;
            develop)
              if [ "$BRANCH" != "develop" ]; then
                echo "::error::develop may only be deployed from the develop branch, not $BRANCH."
                exit 1
              fi
              workspace="develop"
              snapshots="false"
              # The VM is the whole cost of an environment; an idle one should
              # not be running. Started again by any deploy, or dev-lifecycle.
              auto_stop="true"
              # Defaults to dev.<production domain> so the two cannot drift
              # apart silently; set TOMB_DEVELOP_DOMAIN to override.
              domain="${DEV_DOMAIN:-}"
              if [ -z "$domain" ] && [ -n "$PROD_DOMAIN" ]; then
                domain="dev.$PROD_DOMAIN"
              fi
              ;;
            *)
              echo "::error::Unknown environment '$environment'."
              exit 1
              ;;
          esac

          {
            echo "environment=$environment"
            echo "workspace=$workspace"
            echo "domain=$domain"
            echo "snapshots=$snapshots"
            echo "auto_stop=$auto_stop"
            echo "apply=$apply"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Target"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`$environment\` |"
            echo "| Workspace | \`$workspace\` |"
            echo "| Hostname | ${domain:-_sslip.io fallback_} |"
            echo "| Applies | $apply |"
            echo "| Stops nightly | $auto_stop |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate: the application test suite must pass before anything is deployed.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  # ---------------------------------------------------------------------------
  # Build and push the container image, tagged with the commit SHA.
  # ---------------------------------------------------------------------------
  build:
    name: Build and push image
    needs: test
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Compute the image tag
        id: meta
        run: |
          host="${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev"
          image="$host/${{ vars.GCP_PROJECT_ID }}/tomb/platform:${GITHUB_SHA::12}"
          echo "host=$host"   >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ steps.meta.outputs.host }}" --quiet

      - name: Build
        run: docker build -t "${{ steps.meta.outputs.image }}" .

      - name: Push
        # Tags are immutable in this repository, so a re-run of the same commit
        # finds the tag already present. That is success, not failure.
        run: |
          if docker push "${{ steps.meta.outputs.image }}"; then
            echo "pushed ${{ steps.meta.outputs.image }}"
          else
            echo "::notice::Push failed; checking whether this tag already exists"
            gcloud artifacts docker images describe "${{ steps.meta.outputs.image }}" >/dev/null
            echo "::notice::Tag already present (immutable tags); continuing"
          fi

  # ---------------------------------------------------------------------------
  # Apply. Gated by the `production` environment.
  # ---------------------------------------------------------------------------
  apply:
    name: Apply to ${{ needs.resolve.outputs.environment }}
    needs: [resolve, test, build]
    # `always()` so an infrastructure-only dispatch (build skipped) still runs,
    # but only when nothing failed. Whether this run applies at all, and where,
    # was decided once in `resolve` -- see the note at the top of this file.
    if: ${{ always()
      && needs.resolve.outputs.apply == 'true'
      && needs.resolve.result == 'success'
      && needs.test.result == 'success'
      && needs.build.result != 'failure'
      && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ steps.outputs.outputs.service_url }}
    defaults:
      run:
        working-directory: tofu
    outputs:
      service_url: ${{ steps.outputs.outputs.service_url }}
      instance_name: ${{ steps.outputs.outputs.instance_name }}
      zone: ${{ steps.outputs.outputs.zone }}
      public_ip: ${{ steps.outputs.outputs.public_ip }}

    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.12.6

      - name: Preflight - can the deployer actually do this?
        # tofu/bootstrap is applied by hand, so its role list can drift behind
        # what the main configuration needs. That drift otherwise surfaces as a
        # 403 partway through an apply, after earlier resources have already
        # been created or destroyed.
        #
        # Uses the Resource Manager testIamPermissions endpoint directly.
        # `gcloud projects test-iam-permissions` does not exist -- an earlier
        # version of this step called it, and because the failure was silenced
        # the broken command looked exactly like "no permissions granted" and
        # blocked a deploy with a false alarm. Hence: no stderr suppression, and
        # an API failure is reported as an API failure rather than as a missing
        # permission.
        run: |
          set -euo pipefail

          cat > /tmp/required.json <<'JSON'
          {"permissions":[
            "compute.instances.create",
            "compute.disks.create",
            "compute.firewalls.create",
            "compute.resourcePolicies.create",
            "compute.addresses.create",
            "secretmanager.secrets.create",
            "iam.serviceAccounts.create"
          ]}
          JSON

          token="$(gcloud auth print-access-token)"

          http_code=$(curl -sS -o /tmp/granted.json -w '%{http_code}'             -X POST             -H "Authorization: Bearer $token"             -H "Content-Type: application/json"             "https://cloudresourcemanager.googleapis.com/v1/projects/${{ vars.GCP_PROJECT_ID }}:testIamPermissions"             -d @/tmp/required.json)

          if [ "$http_code" != "200" ]; then
            echo "::error::testIamPermissions returned HTTP $http_code, so the preflight could not run."
            cat /tmp/granted.json
            exit 1
          fi

          python3 - <<'PY'
          import json, sys

          required = set(json.load(open("/tmp/required.json"))["permissions"])
          granted = set(json.load(open("/tmp/granted.json")).get("permissions", []))
          missing = sorted(required - granted)

          if missing:
              print("::error::The deployer service account is missing: " + " ".join(missing))
              print("::error::tofu/bootstrap grants these, and it is applied by hand. Re-apply it:")
              print("::error::  cd tofu/bootstrap && tofu plan -out=tfplan && tofu apply tfplan")
              sys.exit(1)

          print(f"deployer holds all {len(required)} permissions this apply needs")
          PY

      - name: Init
        run: tofu init -backend-config="bucket=${{ vars.GCP_STATE_BUCKET }}"

      - name: Select the workspace
        # The workspace is what separates develop's state from production's, so
        # selecting the wrong one would apply one environment's plan onto the
        # other's real resources. `-or-create` because develop's workspace does
        # not exist until its first deploy; production is `default`, which
        # always exists. tofu/environments.tf explains the mapping.
        run: |
          set -euo pipefail
          workspace="${{ needs.resolve.outputs.workspace }}"
          tofu workspace select -or-create "$workspace"
          selected="$(tofu workspace show)"
          if [ "$selected" != "$workspace" ]; then
            echo "::error::Asked for workspace '$workspace' but '$selected' is selected."
            exit 1
          fi
          echo "workspace: $selected -> environment ${{ needs.resolve.outputs.environment }}"

      - name: Resolve the image to deploy
        id: image
        run: |
          if [ -n "${{ needs.build.outputs.image }}" ]; then
            echo "image=${{ needs.build.outputs.image }}" >> "$GITHUB_OUTPUT"
          else
            # Infrastructure-only run: keep whatever Cloud Run is serving.
            current=$(tofu output -raw deployed_image 2>/dev/null || true)
            if [ -z "$current" ]; then
              echo "::error::No image was built and none is recorded in state. Run without skip_build for the first deploy."
              exit 1
            fi
            echo "image=$current" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply
        # `domain`, `enable_snapshots` and `enable_auto_stop` come from
        # `resolve`, not straight from a repository variable: they are what
        # differs between environments, and resolve is the single place that
        # difference is decided.
        run: |
          tofu apply -auto-approve -lock-timeout=5m -input=false \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="guild_realm=${{ vars.TOMB_GUILD_REALM }}" \
            -var="bnet_client_id=${{ vars.BNET_CLIENT_ID }}" \
            -var="domain=${{ needs.resolve.outputs.domain }}" \
            -var="enable_snapshots=${{ needs.resolve.outputs.snapshots }}" \
            -var="enable_auto_stop=${{ needs.resolve.outputs.auto_stop }}" \
            -var="acme_email=${{ vars.ACME_EMAIL }}" \
            -var="image=${{ steps.image.outputs.image }}"

      - name: Read outputs
        id: outputs
        run: |
          set -euo pipefail

          # Cross-check: the state just written must agree about which
          # environment it is. If the workspace and the configuration ever
          # disagree, this is the cheapest place to find out.
          actual="$(tofu output -raw environment)"
          if [ "$actual" != "${{ needs.resolve.outputs.environment }}" ]; then
            echo "::error::Applied state reports environment '$actual' but this run targeted '${{ needs.resolve.outputs.environment }}'."
            exit 1
          fi

          {
            echo "service_url=$(tofu output -raw service_url)"
            echo "instance_name=$(tofu output -raw instance_name)"
            echo "zone=$(tofu output -raw zone)"
            echo "public_ip=$(tofu output -raw public_ip)"
          } >> "$GITHUB_OUTPUT"

      - name: Reserved address
        # Written to the summary immediately after apply, BEFORE the roll, so a
        # first deploy that cannot get a certificate still tells you the address
        # to point DNS at. Without this the first deploy of a new environment
        # fails at the TLS step and takes the one fact you needed with it.
        run: |
          set -euo pipefail
          ip="$(tofu output -raw public_ip)"
          echo "::notice::${{ needs.resolve.outputs.environment }} reserved address: $ip"
          echo "DNS record needed: ${{ needs.resolve.outputs.domain }}. A $ip"
          {
            echo "### ${{ needs.resolve.outputs.environment }} address"
            echo ""
            echo "Reserved public IP: \`$ip\`"
            echo ""
            echo "The hostname \`${{ needs.resolve.outputs.domain }}\` must have an"
            echo "A record pointing here before Caddy can obtain a certificate."
            echo "This address survives VM recreation."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Start the VM if it is stopped
        # develop stops itself overnight (autostop.tf), so a deploy has to be
        # able to wake it. The roll below runs over SSH and would otherwise fail
        # ten times and give up against a TERMINATED instance.
        #
        # Starting is enough to bring the stack back on its own: startup.sh runs
        # on every boot and is idempotent. This step only has to get the machine
        # to RUNNING; the deploy that follows puts the right image on it.
        env:
          ZONE: ${{ steps.outputs.outputs.zone }}
          INSTANCE: ${{ steps.outputs.outputs.instance_name }}
        run: |
          set -euo pipefail

          status="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --format='value(status)')"
          echo "$INSTANCE is $status"

          if [ "$status" = "RUNNING" ]; then
            exit 0
          fi

          echo "::notice::Starting $INSTANCE (was $status)"
          gcloud compute instances start "$INSTANCE" --zone "$ZONE" --quiet

          for i in $(seq 1 20); do
            status="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --format='value(status)')"
            if [ "$status" = "RUNNING" ]; then
              echo "running after $i check(s)"
              exit 0
            fi
            sleep 6
          done

          echo "::error::$INSTANCE did not reach RUNNING; last status $status"
          exit 1

      - name: Roll the VM onto the new image
        # The VM owns its own configuration: startup.sh writes /opt/tomb/.env
        # from instance metadata and Secret Manager at boot. A deploy is just a
        # pull and a restart, run over an IAP tunnel so the VM exposes no
        # public SSH.
        #
        # RETRY ONLY WHAT RETRYING CAN FIX.
        #
        # A freshly created VM may still be installing Docker, so SSH itself can
        # fail for a minute or two; that is worth retrying. A deploy script that
        # actually RAN and then failed is not -- running it again produces the
        # same answer, more slowly.
        #
        # Retrying everything cost 32 minutes on develop's first deploy and,
        # worse, fourteen failed Let's Encrypt validations for a hostname that
        # did not resolve. LE allows five per hostname per hour, so blind retry
        # turned a missing DNS record into an hour of rate-limiting on top.
        #
        # gcloud returns 255 when SSH itself fails and the remote command's own
        # exit status otherwise, which is exactly the distinction needed:
        #
        #   255  could not connect        -> still bootstrapping, retry
        #   3    ran; stack up, TLS not   -> DNS is missing, stop and say so
        #   *    ran; something broke     -> stop, the script printed why
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          INSTANCE: ${{ steps.outputs.outputs.instance_name }}
          ZONE: ${{ steps.outputs.outputs.zone }}
          DOMAIN: ${{ needs.resolve.outputs.domain }}
          PUBLIC_IP: ${{ steps.outputs.outputs.public_ip }}
        run: |
          echo "::notice::Deploying $IMAGE to $INSTANCE in $ZONE"

          rc=0
          for attempt in $(seq 1 10); do
            set +e
            gcloud compute ssh "$INSTANCE" --zone "$ZONE" --tunnel-through-iap --quiet --command "sudo /opt/tomb/deploy.sh '$IMAGE'"
            rc=$?
            set -e

            if [ "$rc" -eq 0 ]; then
              echo "deploy succeeded on attempt $attempt"
              exit 0
            fi

            if [ "$rc" -ne 255 ]; then
              break
            fi

            # 255 is SSH itself failing, which has two causes here and one of
            # them needs action rather than patience. The VM may still be
            # installing Docker on a first boot -- wait. Or the nightly
            # auto-stop schedule may have switched it off underneath this
            # deploy: it is a Compute Engine resource policy and knows nothing
            # about workflow runs, so a deploy that starts near the schedule can
            # lose its VM half way through. Waiting will not fix that one.
            status="$(gcloud compute instances describe "$INSTANCE" --zone "$ZONE" --format='value(status)' 2>/dev/null || echo UNKNOWN)"
            if [ "$status" = "TERMINATED" ]; then
              echo "::warning::$INSTANCE is TERMINATED mid-deploy; the auto-stop schedule fired. Restarting it."
              gcloud compute instances start "$INSTANCE" --zone "$ZONE" --quiet || true
            else
              echo "attempt $attempt could not reach the VM over SSH (exit 255, status $status); it may still be bootstrapping"
            fi
            sleep 30
          done

          if [ "$rc" -eq 3 ]; then
            echo "::error::$DOMAIN has no certificate yet. The stack is up; TLS is the only thing missing."
            {
              echo "### DNS is the missing piece"
              echo ""
              echo "The develop stack deployed and the app is healthy. Caddy cannot obtain a"
              echo "certificate because the hostname does not point at this VM yet."
              echo ""
              echo '```'
              echo "$DOMAIN.  A  $PUBLIC_IP"
              echo '```'
              echo ""
              echo "That address is reserved and survives VM recreation. Add the record, then"
              echo "push to \`develop\` again."
              echo ""
              echo "**Do not re-run the deploy until the name resolves.** Each attempt spends"
              echo "part of an hourly Let's Encrypt budget of five failed validations for this"
              echo "hostname, and exhausting it delays issuance even after DNS is correct."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ "$rc" -eq 255 ]; then
            echo "::error::Could not reach $INSTANCE over SSH after 10 attempts. Serial console:"
            gcloud compute instances get-serial-port-output "$INSTANCE" --zone "$ZONE" 2>/dev/null | tail -40 || true
          else
            echo "::error::/opt/tomb/deploy.sh failed on $INSTANCE with exit $rc. Its output is above."
          fi
          exit 1


  # ---------------------------------------------------------------------------
  # Post-deploy verification. A deploy that reports success without proving the
  # service answers is not a deploy.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify ${{ needs.resolve.outputs.environment }}
    needs: [resolve, apply]
    runs-on: ubuntu-latest

    steps:
      # Authenticate up front so the diagnostic step at the bottom can reach the
      # VM. Verification failing used to produce twenty identical "couldn't
      # connect" lines and nothing else -- no container state, no logs, no
      # indication of which of app, db or Caddy had died -- which turned a
      # one-line answer into an SSH session.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Liveness
        run: |
          url="${{ needs.apply.outputs.service_url }}"
          echo "probing $url"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$url/healthz" | grep -qx ok; then
              echo "healthz ok (attempt $i)"
              exit 0
            fi
            echo "  attempt $i failed; retrying"
            sleep 6
          done
          echo "::error::/healthz never returned ok - the revision is not serving"
          exit 1

      - name: Readiness, including the database
        run: |
          url="${{ needs.apply.outputs.service_url }}"
          for i in $(seq 1 20); do
            if curl -fsS --max-time 10 "$url/readyz" | grep -qx ok; then
              echo "readyz ok (attempt $i)"
              exit 0
            fi
            echo "  attempt $i failed; retrying"
            sleep 6
          done
          echo "::error::/readyz never returned ok - the app is up but cannot reach Postgres"
          exit 1

      - name: Landing page renders
        run: |
          url="${{ needs.apply.outputs.service_url }}"
          body=$(curl -fsS --max-time 15 "$url/")
          echo "$body" | grep -q "Sign in with Battle.net" \
            || { echo "::error::Landing page is missing the sign-in action"; exit 1; }
          echo "landing page ok"

      - name: Guild gate is enforced
        run: |
          url="${{ needs.apply.outputs.service_url }}"
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$url/app/dashboard")
          if [ "$code" != "302" ]; then
            echo "::error::/app/dashboard returned $code for an anonymous request; expected a 302 redirect"
            exit 1
          fi
          echo "anonymous access correctly redirected"

      - name: Sign-in actually reaches Battle.net
        # The check that was missing when a header took the front door off.
        #
        # Every other probe in this job passes on a site nobody can log into.
        # /healthz, /readyz, the landing page rendering and the anonymous guild
        # gate were all green while clicking "Sign in with Battle.net" did
        # nothing whatsoever: the CSP permitted the POST to /auth/login and then
        # forbade the 302 to oauth.battle.net, so the browser declined to
        # navigate and showed no error at all. A plain curl follows that
        # redirect happily, which is why nothing here noticed.
        #
        # So this does what a browser does, which is the only way to catch it.
        # form-action is enforced against the document that SUBMITS the form, so
        # the policy comes from the landing page, and it is checked against the
        # redirect the POST actually returns.
        #
        # No credentials needed. Everything up to Blizzard's own login page is
        # ours, and that is exactly the part that broke.
        env:
          URL: ${{ needs.apply.outputs.service_url }}
        run: |
          set -euo pipefail

          curl -sS -D /tmp/landing.h -o /dev/null --max-time 20 "$URL/"
          curl -sS -D /tmp/login.h -o /dev/null --max-time 20 -X POST "$URL/auth/login"

          python3 - <<'PY'
          import os, sys
          from urllib.parse import urlparse, parse_qs

          def parse(path):
              status, headers = None, {}
              with open(path, encoding="utf-8", errors="replace") as fh:
                  for raw in fh:
                      line = raw.strip()
                      if line.startswith("HTTP/"):
                          parts = line.split()
                          if status is None and len(parts) > 1:
                              status = parts[1]
                      elif ":" in line:
                          key, value = line.split(":", 1)
                          headers.setdefault(key.strip().lower(), value.strip())
              return status, headers

          site = os.environ["URL"].rstrip("/")
          problems = []

          login_status, login_headers = parse("/tmp/login.h")
          _, landing_headers = parse("/tmp/landing.h")

          def die(messages):
              for message in messages:
                  print("::error::" + message)
              sys.exit(1)

          if login_status != "302":
              die([f"POST /auth/login returned {login_status}, want 302. "
                   "Sign-in is not starting the OAuth flow at all."])

          location = login_headers.get("location", "")
          parsed = urlparse(location)
          origin = parsed.scheme + "://" + parsed.netloc

          if parsed.netloc != "oauth.battle.net":
              problems.append(f"sign-in redirects to {origin!r}, want https://oauth.battle.net")

          query = parse_qs(parsed.query)
          expected_callback = site + "/auth/callback"
          callback = (query.get("redirect_uri") or [""])[0]
          if callback != expected_callback:
              problems.append(
                  f"redirect_uri is {callback!r}, want {expected_callback!r}. Blizzard matches "
                  "this exactly, so a mismatch fails sign-in after the member approves access.")

          if not (query.get("client_id") or [""])[0]:
              problems.append("no client_id on the authorize URL; BNET_CLIENT_ID is not reaching the app.")

          # The browser rule. form-action does NOT fall back to default-src, so
          # an absent directive permits the submission, while a present one must
          # name the redirect's origin or the navigation is silently refused.
          directives = {}
          for part in landing_headers.get("content-security-policy", "").split(";"):
              fields = part.split()
              if fields:
                  directives[fields[0].lower()] = fields[1:]

          form_action = directives.get("form-action")
          if form_action is not None and origin not in form_action and "*" not in form_action:
              problems.append(
                  f"the landing page's CSP has form-action {form_action}, which does not permit "
                  f"{origin}. A browser checks form-action against the REDIRECT TARGET of a form "
                  "submission, so clicking sign-in will silently do nothing: no error page, no "
                  "failed request, just a console violation. curl cannot see this.")

          if problems:
              die(problems)

          print("sign-in reaches " + origin)
          print("  redirect_uri: " + callback)
          print("  form-action:  " + str(form_action))
          PY

      # Runs whatever failed above. `if: failure()` rather than `always()`: on a
      # green deploy there is nothing to look at.
      - name: Why it failed
        if: failure()
        run: |
          instance="${{ needs.apply.outputs.instance_name }}"
          zone="${{ needs.apply.outputs.zone }}"
          url="${{ needs.apply.outputs.service_url }}"
          host="${url#https://}"

          echo "::group::What the name resolves to"
          # A hostname pointing somewhere other than the VM looks identical to a
          # dead VM from a curl, and is the likelier cause right after a domain
          # change.
          getent hosts "$host" || echo "  $host does not resolve"
          echo "  reserved address of the VM: $(gcloud compute addresses list             --filter="name~tomb" --format='value(address)' 2>/dev/null || echo unknown)"
          echo "::endgroup::"

          echo "::group::Ports"
          for port in 80 443; do
            if timeout 10 bash -c "</dev/tcp/$host/$port" 2>/dev/null; then
              echo "  $port open"
            else
              echo "  $port CLOSED"
            fi
          done
          echo "::endgroup::"

          echo "::group::Containers on the VM"
          gcloud compute ssh "$instance" --zone "$zone" --tunnel-through-iap --quiet             --command 'cd /opt/tomb && sudo docker compose --env-file .env ps -a' || true
          echo "::endgroup::"

          echo "::group::Caddy logs"
          gcloud compute ssh "$instance" --zone "$zone" --tunnel-through-iap --quiet             --command 'cd /opt/tomb && sudo docker compose --env-file .env logs --tail 80 caddy' || true
          echo "::endgroup::"

          echo "::group::App logs"
          gcloud compute ssh "$instance" --zone "$zone" --tunnel-through-iap --quiet             --command 'cd /opt/tomb && sudo docker compose --env-file .env logs --tail 40 app' || true
          echo "::endgroup::"

          echo "::group::Caddyfile as generated on the VM"
          gcloud compute ssh "$instance" --zone "$zone" --tunnel-through-iap --quiet             --command 'sudo cat -n /opt/tomb/Caddyfile' || true
          echo "::endgroup::"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${{ needs.resolve.outputs.environment }}\` |"
            echo "| URL | ${{ needs.apply.outputs.service_url }} |"
            echo "| Address | \`${{ needs.apply.outputs.public_ip }}\` |"
            echo "| Commit | \`${GITHUB_SHA::12}\` |"
            echo ""
            echo "Liveness, readiness, landing page and the anonymous guild gate all verified."
          } >> "$GITHUB_STEP_SUMMARY"
