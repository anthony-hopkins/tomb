# Principle IV: `docker compose up --build` is the entire local setup.
# No host-machine Go or Postgres install required.
#
# Run this from Windows (PowerShell or Git Bash). Docker Desktop's WSL
# integration is currently disabled for the Ubuntu distro, so `docker` resolves
# but fails inside WSL. See quickstart.md.

services:
  app:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      # Compose owns the database URL; everything else comes from .env
      DATABASE_URL: postgres://tomb:tomb@db:5432/tomb?sslmode=disable
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /readyz reports database reachability; /healthz would pass too early.
      test: ["CMD", "/app/tomb", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  db:
    # Pinned to the same major version as Cloud SQL in tofu/database.tf.
    image: postgres:18
    environment:
      POSTGRES_USER: tomb
      POSTGRES_PASSWORD: tomb
      POSTGRES_DB: tomb
    volumes:
      # Postgres 18+ wants a single mount at /var/lib/postgresql, which places
      # the data in a versioned subdirectory. Mounting .../data directly (the
      # pre-18 convention) makes the container refuse to start.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tomb -d tomb"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
